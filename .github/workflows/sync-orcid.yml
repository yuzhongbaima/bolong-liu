name: Sync ORCID publications

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_orcid.py
      - name: Commit updated publication data
        run: |
          if git diff --quiet -- data/orcid-works.json; then
            echo "No ORCID changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcid-works.json
          git commit -m "chore: sync ORCID publications"
          git push
